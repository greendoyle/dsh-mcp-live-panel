<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCP 服务面板</title>
<link rel="stylesheet" href="{{BASE}}/app.css">
</head>
<body>
<main>
  <header class="top">
    <div class="titles">
      <h1>MCP 服务面板</h1>
      <p class="sub">在这里增删改 MCP 服务器，保存即生效 —— 不用再手改配置文件</p>
    </div>
    <div class="actions">
      <button id="btn-new" class="primary" type="button">＋ 新增服务器</button>
      <button id="btn-reload" type="button" title="重新读取服务器列表文件（手工改过文件时用）">重新读取</button>
      <button id="btn-refresh" type="button">刷新</button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <section id="editor" class="editor" hidden>
    <h2 id="editor-title">新增服务器</h2>
    <form id="editor-form" autocomplete="off">
      <div class="grid">
        <label class="field">
          <span>名称（决定工具前缀 <code>mcp__名称__*</code>）</span>
          <input name="serverName" required maxlength="32" placeholder="godot">
        </label>
        <label class="field">
          <span>传输方式</span>
          <select name="transport">
            <option value="stdio">stdio（本地进程）</option>
            <option value="streamable-http">streamable-http（HTTP）</option>
          </select>
        </label>
        <label class="field full only-stdio">
          <span>启动命令</span>
          <input name="command" placeholder="node  /  C:\path\to\server.exe">
        </label>
        <label class="field full only-stdio">
          <span>参数（每行一个）</span>
          <textarea name="args" rows="2" placeholder="--executablePath"></textarea>
        </label>
        <label class="field full only-stdio">
          <span>环境变量（每行 KEY=VALUE）</span>
          <textarea name="env" rows="2" placeholder="GODOT_PATH=C:\path\godot.exe"></textarea>
        </label>
        <label class="field only-stdio">
          <span>工作目录（可选）</span>
          <input name="cwd" placeholder="留空则继承 Host">
        </label>
        <label class="field full only-http">
          <span>MCP 地址</span>
          <input name="url" placeholder="http://127.0.0.1:3000/mcp">
        </label>
        <label class="field full only-http">
          <span>请求头（每行 Key: Value）</span>
          <textarea name="headers" rows="2"></textarea>
        </label>
        <label class="field">
          <span>工具调用超时（毫秒）</span>
          <input name="toolCallTimeoutMs" type="number" min="1000" step="1000" value="60000">
        </label>
        <label class="field">
          <span>断线重连次数</span>
          <input name="reconnectAttempts" type="number" min="1" step="1" value="10">
        </label>
        <label class="check"><input type="checkbox" name="autoReconnect" checked> 断线自动重连</label>
        <label class="check"><input type="checkbox" name="failOnStartupError"> 连接失败时视为插件加载失败</label>
        <label class="check"><input type="checkbox" name="enabled" checked> 启用</label>
      </div>
      <p id="editor-error" class="error" hidden></p>
      <div class="editor-actions">
        <button type="submit" class="primary">保存</button>
        <button type="button" id="btn-cancel">取消</button>
        <span class="hint">保存后立刻按新配置重连；连接失败的原因会显示在卡片上。</span>
      </div>
    </form>
  </section>

  <div id="list" class="list"></div>

  <footer>
    <span>列表文件：<span id="store" class="mono">…</span></span>
    <span>更新于 <span id="stamp">—</span></span>
    <span>每 4 秒自动刷新</span>
  </footer>
</main>
<div id="toast" class="toast" hidden></div>
<script src="{{BASE}}/app.js"></script>
</body>
</html>
